# Smithery configuration: the server runs locally over stdio via npx.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - evolutionApiUrl
      - evolutionApiKey
    properties:
      evolutionApiUrl:
        type: string
        description: Base URL of your Evolution API server (EVOLUTION_API_URL). Use https outside localhost.
      evolutionApiKey:
        type: string
        description: Evolution API key (EVOLUTION_API_KEY). Treated as a secret.
      defaultInstance:
        type: string
        description: Default instance when a tool omits "instance" (EVOLUTION_DEFAULT_INSTANCE).
      timeoutMs:
        type: number
        description: Per-request timeout in milliseconds (EVOLUTION_TIMEOUT_MS), default 30000.
      readOnly:
        type: boolean
        default: false
        description: Hide every tool that sends or changes state (EVOLUTION_READ_ONLY).
      allowedNumbers:
        type: string
        description: Comma-separated numbers send tools may reach (EVOLUTION_ALLOWED_NUMBERS). Empty means no restriction.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'evolution-whatsapp-mcp'],
      env: {
        EVOLUTION_API_URL: config.evolutionApiUrl,
        EVOLUTION_API_KEY: config.evolutionApiKey,
        EVOLUTION_DEFAULT_INSTANCE: config.defaultInstance || '',
        EVOLUTION_TIMEOUT_MS: config.timeoutMs ? String(config.timeoutMs) : '',
        EVOLUTION_READ_ONLY: config.readOnly ? 'true' : 'false',
        EVOLUTION_ALLOWED_NUMBERS: config.allowedNumbers || ''
      }
    })
